<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" fill="none">
  <defs>
    <linearGradient id="ddGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ddCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background Base Frame -->
  <rect x="0" y="0" width="400" height="220" rx="16" fill="url(#ddCardBg)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Grid Matrix Overlay -->
  <path d="M 0 55 H 400 M 0 110 H 400 M 0 165 H 400" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="3 3" />
  <path d="M 100 0 V 220 M 200 0 V 220 M 300 0 V 220" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="3 3" />

  <!-- Audio Waveform Visualization -->
  <g transform="translate(40, 110)">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="-28" x2="12" y2="28" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="-45" x2="24" y2="45" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="-20" x2="36" y2="20" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="-50" x2="48" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="-32" x2="60" y2="32" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <line x1="72" y1="-18" x2="72" y2="18" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central AI Neural Transform Node -->
  <circle cx="200" cy="110" r="32" fill="#0f172a" stroke="url(#ddGrad)" stroke-width="3" />
  <path d="M190 102 L212 110 L190 118 Z" fill="#10b981" />
  <circle cx="200" cy="110" r="42" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Output Translated Audio Waveform -->
  <g transform="translate(280, 110)">
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="-48" x2="12" y2="48" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="-35" x2="24" y2="35" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="-15" x2="36" y2="15" stroke="#e879f9" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="-40" x2="48" y2="40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="-25" x2="60" y2="25" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Status HUD Pill -->
  <rect x="25" y="20" width="150" height="24" rx="12" fill="#020617" stroke="#10b981" stroke-width="1" />
  <circle cx="37" cy="32" r="3" fill="#10b981" />
  <text x="48" y="36" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8fafc">AI DUBBING PIPELINE</text>

  <rect x="245" y="20" width="130" height="24" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="1" />
  <text x="255" y="36" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">AZURE BLOB SYNC</text>
</svg>

