  <rect x="0" y="0" width="400" height="220" rx="16" fill="url(#jpCardBg)" stroke="#1e293b" stroke-width="1.5" />
  
  <path d="M 0 55 H 400 M 0 110 H 400 M 0 165 H 400" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="3 3" />
